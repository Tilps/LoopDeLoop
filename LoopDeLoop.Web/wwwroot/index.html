<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Loop-de-loop - Slitherlink Puzzle Game</title>
    <base href="./" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loop-de-loop" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('loopdeloop_theme') || 
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (_) {}
        })();
    </script>
</head>

<body>
    <div id="app">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:system-ui,-apple-system,sans-serif;background-color:var(--bg-primary,#f8fafc);">
            <style>
                .initial-loader {
                    width: 48px;
                    height: 48px;
                    border: 4px solid #e2e8f0;
                    border-top-color: #2563eb;
                    border-radius: 50%;
                    animation: initial-spin 0.8s linear infinite;
                    margin-bottom: 1.25rem;
                }
                @keyframes initial-spin {
                    to { transform: rotate(360deg); }
                }
            </style>
            <div class="initial-loader"></div>
            <div style="font-size:1.15rem;font-weight:600;color:#334155;">Loading Loop-de-loop...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.loopHelpers = {
            copyToClipboard: async (text) => {
                try {
                    if (navigator.clipboard) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                } catch (_) {}
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            },
            getUrlHash: () => window.location.hash || '',
            setUrlHash: (hash) => {
                if (history.replaceState) {
                    history.replaceState(null, null, hash ? '#' + hash : window.location.pathname);
                } else {
                    window.location.hash = hash;
                }
            },
            getBaseUrl: () => window.location.href.split('#')[0],
            setTheme: (theme) => {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('loopdeloop_theme', theme); } catch (_) {}
            },
            getTheme: () => {
                try {
                    const saved = localStorage.getItem('loopdeloop_theme');
                    if (saved) return saved;
                } catch (_) {}
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            },
            loadGameState: () => {
                try { return localStorage.getItem('loopdeloop_gamestate'); } catch (_) { return null; }
            },
            saveGameState: (json) => {
                try { localStorage.setItem('loopdeloop_gamestate', json); } catch (_) {}
            },
            clearGameState: () => {
                try { localStorage.removeItem('loopdeloop_gamestate'); } catch (_) {}
            },
            reloadFromServer: async () => {
                try {
                    if ('serviceWorker' in navigator) {
                        const regs = await navigator.serviceWorker.getRegistrations();
                        for (let r of regs) await r.unregister();
                    }
                    if ('caches' in window) {
                        const keys = await caches.keys();
                        for (let k of keys) await caches.delete(k);
                    }
                } catch (_) {}
                window.location.reload(true);
            }
        };

        window.registerLoopShortcuts = (dotNetRef) => {
            window._dotNetHomeRef = dotNetRef;
            window.addEventListener('keydown', (e) => {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
                if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) {
                    e.preventDefault();
                    dotNetRef.invokeMethodAsync('OnShortcut', 'undo');
                } else if (e.ctrlKey && (e.key === 'y' || e.key === 'Y')) {
                    e.preventDefault();
                    dotNetRef.invokeMethodAsync('OnShortcut', 'redo');
                } else if (e.ctrlKey && (e.key === 'f' || e.key === 'F')) {
                    e.preventDefault();
                    dotNetRef.invokeMethodAsync('OnShortcut', 'fix');
                } else if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                    e.preventDefault();
                    dotNetRef.invokeMethodAsync('OnShortcut', 'unfix');
                } else if (e.ctrlKey && (e.key === 'r' || e.key === 'R')) {
                    e.preventDefault();
                    dotNetRef.invokeMethodAsync('OnShortcut', 'revert');
                } else if (e.ctrlKey && (e.key === 'h' || e.key === 'H')) {
                    e.preventDefault();
                    if (e.shiftKey) {
                        dotNetRef.invokeMethodAsync('OnShortcut', 'dohint');
                    } else {
                        dotNetRef.invokeMethodAsync('OnShortcut', 'hint');
                    }
                }
            });
        };

        if (!window._loopGlobalTouchInit) {
            window._loopGlobalTouchInit = true;
            window._loopTouchCount = 0;
            const updateTouchCount = (e) => {
                window._loopTouchCount = e.touches ? e.touches.length : 0;
            };
            window.addEventListener('touchstart', updateTouchCount, { passive: true, capture: true });
            window.addEventListener('touchend', updateTouchCount, { passive: true, capture: true });
            window.addEventListener('touchcancel', updateTouchCount, { passive: true, capture: true });
        }

        window.initLoopBoard = (svgId, dotNetRef) => {
            const svg = document.getElementById(svgId);
            if (!svg) return;

            window._dotNetHomeRef = dotNetRef;
            svg._dotNetRef = dotNetRef;
            if (svg._loopInitialized) return;
            svg._loopInitialized = true;

            const activePointers = new Map();
            let isMiddlePanning = false;
            let lastMouseX = 0, lastMouseY = 0;
            let pinchStartDist = 0;
            let pinchStartMidX = 0, pinchStartMidY = 0;

            let firstTouchTime = 0;
            let firstTouchStartX = 0;
            let firstTouchStartY = 0;
            let firstTouchPointerId = null;
            let firstTouchDispatched = false;
            let firstTouchMovedDist = 0;

            function getSvgCoords(e) {
                let pt = svg.createSVGPoint();
                pt.x = e.clientX;
                pt.y = e.clientY;
                let ctm = svg.getScreenCTM();
                if (!ctm) return null;
                let p = pt.matrixTransform(ctm.inverse());
                return { x: p.x, y: p.y };
            }

            svg.onpointerdown = (e) => {
                e.preventDefault();
                try { svg.setPointerCapture(e.pointerId); } catch (_) {}
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                const isTouch = e.pointerType === 'touch';
                const touchCount = window._loopTouchCount || 0;
                // If 2+ fingers are already known to be touching down:
                // (e.g. from touchstart count, existing active pointers, or secondary pointer)
                const alreadyMultipleFingers = isTouch && (activePointers.size > 1 || touchCount >= 2 || !e.isPrimary);

                if (activePointers.size === 1) {
                    if (e.button === 1) {
                        isMiddlePanning = true;
                        lastMouseX = e.clientX;
                        lastMouseY = e.clientY;
                        return;
                    }

                    if (alreadyMultipleFingers) {
                        // Already 2+ fingers down: do not trigger single-finger puzzle edit
                        firstTouchDispatched = false;
                        return;
                    }

                    let coords = getSvgCoords(e);
                    if (!coords) return;

                    if (isTouch) {
                        firstTouchTime = performance.now();
                        firstTouchStartX = e.clientX;
                        firstTouchStartY = e.clientY;
                        firstTouchPointerId = e.pointerId;
                        firstTouchDispatched = true;
                        firstTouchMovedDist = 0;
                    }

                    if (svg._dotNetRef) {
                        svg._dotNetRef.invokeMethodAsync('OnSvgPointerDown', coords.x, coords.y, e.button, e.shiftKey);
                    }
                } else if (activePointers.size === 2) {
                    const elapsed = performance.now() - firstTouchTime;

                    // If second finger lands almost immediately (<= 300ms),
                    // or within 600ms while remaining stationary (moved <= 20px),
                    // revert the first speculative touch modification!
                    // If the first finger dragged across edges or elapsed > 600ms, do NOT revert.
                    const isStationary = firstTouchMovedDist <= 20;
                    const shouldRevert = firstTouchDispatched && (elapsed <= 300 || (elapsed <= 600 && isStationary));

                    if (svg._dotNetRef) {
                        if (shouldRevert) {
                            svg._dotNetRef.invokeMethodAsync('OnRevertFirstTouch');
                        } else {
                            svg._dotNetRef.invokeMethodAsync('OnSvgPointerUp');
                        }
                    }

                    firstTouchDispatched = false;

                    const pts = Array.from(activePointers.values());
                    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    pinchStartMidX = (pts[0].x + pts[1].x) / 2;
                    pinchStartMidY = (pts[0].y + pts[1].y) / 2;
                }
            };

            svg.onpointermove = (e) => {
                if (!activePointers.has(e.pointerId)) return;
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    if (isMiddlePanning) {
                        let dx = e.clientX - lastMouseX;
                        let dy = e.clientY - lastMouseY;
                        lastMouseX = e.clientX;
                        lastMouseY = e.clientY;
                        let ctm = svg.getScreenCTM();
                        let svgDx = ctm ? (dx / ctm.a) : dx;
                        let svgDy = ctm ? (dy / ctm.d) : dy;
                        if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnPan', svgDx, svgDy);
                        return;
                    }

                    if (e.pointerId === firstTouchPointerId) {
                        const dist = Math.hypot(e.clientX - firstTouchStartX, e.clientY - firstTouchStartY);
                        if (dist > firstTouchMovedDist) {
                            firstTouchMovedDist = dist;
                        }
                    }

                    if (e.buttons === 0) return;
                    let coords = getSvgCoords(e);
                    if (!coords) return;
                    if (svg._dotNetRef) {
                        svg._dotNetRef.invokeMethodAsync('OnSvgPointerMove', coords.x, coords.y);
                    }
                } else if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    const currentMidX = (pts[0].x + pts[1].x) / 2;
                    const currentMidY = (pts[0].y + pts[1].y) / 2;

                    const scale = pinchStartDist > 0 ? (currentDist / pinchStartDist) : 1;
                    const dx = currentMidX - pinchStartMidX;
                    const dy = currentMidY - pinchStartMidY;
                    let ctm = svg.getScreenCTM();
                    let svgDx = ctm ? (dx / ctm.a) : dx;
                    let svgDy = ctm ? (dy / ctm.d) : dy;

                    if (svg._dotNetRef) {
                        svg._dotNetRef.invokeMethodAsync('OnTwoFingerPanZoom', svgDx, svgDy, scale);
                    }

                    pinchStartDist = currentDist;
                    pinchStartMidX = currentMidX;
                    pinchStartMidY = currentMidY;
                }
            };

            const onPointerEnd = (e) => {
                try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
                if (activePointers.has(e.pointerId)) {
                    activePointers.delete(e.pointerId);
                }

                if (e.type === 'pointercancel' && e.pointerId === firstTouchPointerId && firstTouchDispatched) {
                    const elapsed = performance.now() - firstTouchTime;
                    if (elapsed <= 600 && firstTouchMovedDist <= 20) {
                        if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnRevertFirstTouch');
                    }
                }

                if (e.pointerId === firstTouchPointerId) {
                    firstTouchDispatched = false;
                    firstTouchPointerId = null;
                }
                if (e.button === 1) {
                    isMiddlePanning = false;
                }
                if (activePointers.size === 0) {
                    isMiddlePanning = false;
                    if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnSvgPointerUp');
                } else if (activePointers.size === 1) {
                    pinchStartDist = 0;
                }
            };

            svg.onpointerup = onPointerEnd;
            svg.onpointercancel = onPointerEnd;
            if (svg._windowPointerUpHandler) {
                window.removeEventListener('pointerup', svg._windowPointerUpHandler);
            }
            svg._windowPointerUpHandler = onPointerEnd;
            window.addEventListener('pointerup', onPointerEnd);

            svg.onwheel = (e) => {
                e.preventDefault();
                let factor = e.deltaY < 0 ? 1.15 : 0.87;
                if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnWheelZoom', factor);
            };

            svg.oncontextmenu = (e) => {
                e.preventDefault();
            };
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                if (window._dotNetHomeRef) {
                                    window._dotNetHomeRef.invokeMethodAsync('OnPwaUpdateAvailable');
                                }
                            }
                        });
                    });
                }).catch(err => console.log('SW registration error:', err));
            });
        }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
