<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Loop-de-loop - Slitherlink Puzzle Game</title>
    <base href="./" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loop-de-loop" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('loopdeloop_theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (_) {}
        })();
    </script>
</head>

<body>
    <div id="app">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:system-ui,-apple-system,sans-serif;background-color:var(--bg-primary,#f8fafc);">
            <style>
                .initial-loader {
                    width: 48px;
                    height: 48px;
                    border: 4px solid #e2e8f0;
                    border-top-color: #2563eb;
                    border-radius: 50%;
                    animation: initial-spin 0.8s linear infinite;
                    margin-bottom: 1.25rem;
                }
                @keyframes initial-spin {
                    to { transform: rotate(360deg); }
                }
            </style>
            <div class="initial-loader"></div>
            <div style="font-size:1.15rem;font-weight:600;color:var(--text-primary,#334155);">Loading Loop-de-loop...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window._loopPwaUpdateReady = false;
        window._loopWaitingWorker = null;

        window.loopHelpers = {
            copyToClipboard: async (text) => {
                try {
                    if (navigator.clipboard) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                } catch (_) {}
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '-9999px';
                    ta.style.left = '-9999px';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    return ok;
                } catch (_) {
                    return false;
                }
            },
            getUrlHash: () => window.location.hash || '',
            getUrlSearch: () => window.location.search || '',
            setUrlHash: (hash) => {
                if (history.replaceState) {
                    const base = window.location.pathname + window.location.search;
                    history.replaceState(null, '', hash ? base + '#' + hash : base);
                } else {
                    window._loopSuppressNextHashChange = true;
                    window.location.hash = hash;
                }
            },
            getBaseUrl: () => window.location.href.split('#')[0],
            setTheme: (theme) => {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('loopdeloop_theme', theme); } catch (_) {}
            },
            getTheme: () => {
                try {
                    const saved = localStorage.getItem('loopdeloop_theme');
                    if (saved) return saved;
                } catch (_) {}
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            },
            loadGameState: () => {
                try { return localStorage.getItem('loopdeloop_gamestate'); } catch (_) { return null; }
            },
            saveGameState: (json) => {
                try {
                    localStorage.setItem('loopdeloop_gamestate', json);
                    return true;
                } catch (_) {
                    return false;
                }
            },
            clearGameState: () => {
                try { localStorage.removeItem('loopdeloop_gamestate'); } catch (_) {}
            },
            loadSettings: () => {
                try { return localStorage.getItem('loopdeloop_settings'); } catch (_) { return null; }
            },
            saveSettings: (json) => {
                try {
                    localStorage.setItem('loopdeloop_settings', json);
                    return true;
                } catch (_) {
                    return false;
                }
            },
            setWheelMode: (mode) => {
                window._loopWheelMode = mode || 'zoom';
            },
            getOrCreateInstallationId: () => {
                const key = 'loopdeloop_install_id';
                const uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                try {
                    const existing = localStorage.getItem(key);
                    if (existing && uuidRe.test(existing)) return existing;
                } catch (_) {}

                let id = '';
                try {
                    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                        id = window.crypto.randomUUID();
                    } else if (window.crypto && window.crypto.getRandomValues) {
                        const bytes = new Uint8Array(16);
                        window.crypto.getRandomValues(bytes);
                        bytes[6] = (bytes[6] & 0x0f) | 0x40;
                        bytes[8] = (bytes[8] & 0x3f) | 0x80;
                        const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
                        id = `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
                    }
                } catch (_) {}

                if (!id) {
                    id = '00000000-0000-4000-8000-000000000000';
                }

                try { localStorage.setItem(key, id); } catch (_) {}
                return id;
            },
            resetSeenInputs: () => {
                window._loopSeenInputs = { touch: false, mouse: false, pen: false, keyboard: false };
            },
            getDebugClientInfoJson: () => {
                const seen = window._loopSeenInputs || { touch: false, mouse: false, pen: false, keyboard: false };
                return JSON.stringify({
                    ScreenWidth: (window.screen && window.screen.width) ? Math.round(window.screen.width) : 0,
                    ScreenHeight: (window.screen && window.screen.height) ? Math.round(window.screen.height) : 0,
                    ViewportWidth: window.innerWidth ? Math.round(window.innerWidth) : 0,
                    ViewportHeight: window.innerHeight ? Math.round(window.innerHeight) : 0,
                    DevicePixelRatio: window.devicePixelRatio ? Number(window.devicePixelRatio.toFixed(2)) : 1,
                    SawTouch: !!seen.touch,
                    SawMouse: !!seen.mouse,
                    SawPen: !!seen.pen,
                    SawKeyboard: !!seen.keyboard
                });
            },
            submitDebugLogJson: async (payloadJson) => {
                try {
                    const cfgResp = await fetch('debug-config.json', { cache: 'no-store' });
                    if (!cfgResp.ok) {
                        return JSON.stringify({
                            Ok: false,
                            Status: cfgResp.status,
                            Message: 'Debug upload endpoint is not configured on this server.'
                        });
                    }
                    const cfg = await cfgResp.json();
                    if (!cfg || typeof cfg.endpoint !== 'string' || !cfg.endpoint || typeof cfg.nonce !== 'string' || !cfg.nonce) {
                        return JSON.stringify({
                            Ok: false,
                            Status: 0,
                            Message: 'Invalid server debug configuration.'
                        });
                    }

                    const resp = await fetch(cfg.endpoint, {
                        method: 'POST',
                        cache: 'no-store',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-LoopDeLoop-Nonce': cfg.nonce
                        },
                        body: payloadJson
                    });

                    let serverMsg = '';
                    let serverId = null;
                    try {
                        const data = await resp.json();
                        if (data && typeof data.message === 'string') serverMsg = data.message;
                        if (data && typeof data.id === 'string') serverId = data.id;
                    } catch (_) {}

                    if (resp.ok) {
                        return JSON.stringify({
                            Ok: true,
                            Status: resp.status,
                            Message: serverMsg || 'Debug log uploaded!',
                            Id: serverId
                        });
                    }

                    return JSON.stringify({
                        Ok: false,
                        Status: resp.status,
                        Message: serverMsg || `Upload rejected (HTTP ${resp.status}).`
                    });
                } catch (err) {
                    return JSON.stringify({
                        Ok: false,
                        Status: 0,
                        Message: 'Network error uploading debug log.'
                    });
                }
            },
            downloadTextFile: (filename, content) => {
                try {
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    return true;
                } catch (_) {
                    return false;
                }
            },
            triggerPrint: () => {
                requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
            },
            hasPendingPwaUpdate: () => !!window._loopPwaUpdateReady,
            reloadFromServer: async () => {
                try {
                    if (window._loopWaitingWorker) {
                        let reloading = false;
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            if (!reloading) {
                                reloading = true;
                                window.location.reload();
                            }
                        });
                        window._loopWaitingWorker.postMessage({ type: 'SKIP_WAITING' });
                        return;
                    }
                    if ('serviceWorker' in navigator) {
                        const regs = await navigator.serviceWorker.getRegistrations();
                        for (let r of regs) await r.unregister();
                    }
                    if ('caches' in window) {
                        const keys = await caches.keys();
                        for (let k of keys) await caches.delete(k);
                    }
                } catch (_) {}
                window.location.reload();
            }
        };

        window.unregisterLoopShortcuts = () => {
            if (window._loopKeydownHandler) {
                window.removeEventListener('keydown', window._loopKeydownHandler);
                window._loopKeydownHandler = null;
            }
            if (window._loopHashChangeHandler) {
                window.removeEventListener('hashchange', window._loopHashChangeHandler);
                window._loopHashChangeHandler = null;
            }
            window._dotNetHomeRef = null;
        };

        window.registerLoopShortcuts = (dotNetRef) => {
            window.unregisterLoopShortcuts();
            window._dotNetHomeRef = dotNetRef;
            window._loopHashChangeHandler = () => {
                if (window._loopSuppressNextHashChange) {
                    window._loopSuppressNextHashChange = false;
                    return;
                }
                if (!window._dotNetHomeRef) return;
                window._dotNetHomeRef.invokeMethodAsync('OnUrlHashChanged', window.location.hash || '');
            };
            window.addEventListener('hashchange', window._loopHashChangeHandler);
            window._loopKeydownHandler = (e) => {
                if (!window._dotNetHomeRef) return;
                if (e.key === 'Escape') {
                    window._dotNetHomeRef.invokeMethodAsync('OnShortcut', 'escape');
                    return;
                }
                const target = e.target;
                if (target && (target.tagName === 'INPUT' || target.tagName === 'SELECT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
                    return;
                }
                const mod = e.ctrlKey || e.metaKey;
                if (!mod || e.altKey) return;
                const key = (e.key || '').toLowerCase();
                if (key === 'z') {
                    e.preventDefault();
                    window._dotNetHomeRef.invokeMethodAsync('OnShortcut', e.shiftKey ? 'redo' : 'undo');
                } else if (key === 'y') {
                    e.preventDefault();
                    window._dotNetHomeRef.invokeMethodAsync('OnShortcut', 'redo');
                } else if (key === 'f' && e.ctrlKey) {
                    e.preventDefault();
                    window._dotNetHomeRef.invokeMethodAsync('OnShortcut', 'fix');
                } else if (key === 'u' && e.ctrlKey) {
                    e.preventDefault();
                    window._dotNetHomeRef.invokeMethodAsync('OnShortcut', 'unfix');
                } else if (key === 'r' && e.ctrlKey) {
                    e.preventDefault();
                    window._dotNetHomeRef.invokeMethodAsync('OnShortcut', 'revert');
                } else if (key === 'h') {
                    e.preventDefault();
                    window._dotNetHomeRef.invokeMethodAsync('OnShortcut', e.shiftKey ? 'dohint' : 'hint');
                }
            };
            window.addEventListener('keydown', window._loopKeydownHandler);
        };

        if (!window._loopGlobalTouchInit) {
            window._loopGlobalTouchInit = true;
            window._loopTouchCount = 0;
            window._loopSeenInputs = { touch: false, mouse: false, pen: false, keyboard: false };
            const updateTouchCount = (e) => {
                window._loopTouchCount = e.touches ? e.touches.length : 0;
            };
            window.addEventListener('touchstart', updateTouchCount, { passive: true, capture: true });
            window.addEventListener('touchend', updateTouchCount, { passive: true, capture: true });
            window.addEventListener('touchcancel', updateTouchCount, { passive: true, capture: true });
            window.addEventListener('pointerdown', (e) => {
                if (!window._loopSeenInputs) return;
                if (e.pointerType === 'touch') window._loopSeenInputs.touch = true;
                else if (e.pointerType === 'mouse') window._loopSeenInputs.mouse = true;
                else if (e.pointerType === 'pen') window._loopSeenInputs.pen = true;
            }, { passive: true, capture: true });
            window.addEventListener('keydown', () => {
                if (window._loopSeenInputs) window._loopSeenInputs.keyboard = true;
            }, { passive: true, capture: true });
        }

        window.disposeLoopBoard = (svgId) => {
            const svg = document.getElementById(svgId);
            if (window._loopWindowPointerUpHandler) {
                window.removeEventListener('pointerup', window._loopWindowPointerUpHandler);
                window._loopWindowPointerUpHandler = null;
            }
            if (svg) {
                svg._dotNetRef = null;
                svg._loopInitialized = false;
                svg.onpointerdown = null;
                svg.onpointermove = null;
                svg.onpointerup = null;
                svg.onpointercancel = null;
                svg.onwheel = null;
                svg.oncontextmenu = null;
            }
        };

        window.initLoopBoard = (svgId, dotNetRef) => {
            const svg = document.getElementById(svgId);
            if (!svg) return;

            window._dotNetHomeRef = dotNetRef;
            svg._dotNetRef = dotNetRef;
            if (svg._loopInitialized) return;
            svg._loopInitialized = true;

            const activePointers = new Map();
            let isMiddlePanning = false;
            let lastMouseX = 0, lastMouseY = 0;
            let pinchStartDist = 0;
            let pinchStartMidX = 0, pinchStartMidY = 0;

            let firstTouchTime = 0;
            let firstTouchStartX = 0;
            let firstTouchStartY = 0;
            let firstTouchPointerId = null;
            let firstTouchDispatched = false;
            let firstTouchMovedDist = 0;

            let moveRafId = null;
            let pendingMoveCoords = null;

            function flushPendingMove() {
                moveRafId = null;
                if (pendingMoveCoords && svg._dotNetRef) {
                    const c = pendingMoveCoords;
                    pendingMoveCoords = null;
                    svg._dotNetRef.invokeMethodAsync('OnSvgPointerMove', c.x, c.y);
                }
            }

            function resetPinchBaseline() {
                if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    pinchStartMidX = (pts[0].x + pts[1].x) / 2;
                    pinchStartMidY = (pts[0].y + pts[1].y) / 2;
                } else {
                    pinchStartDist = 0;
                }
            }

            function getSvgCoords(e) {
                let pt = svg.createSVGPoint();
                pt.x = e.clientX;
                pt.y = e.clientY;
                let ctm = svg.getScreenCTM();
                if (!ctm) return null;
                let p = pt.matrixTransform(ctm.inverse());
                return { x: p.x, y: p.y };
            }

            svg.onpointerdown = (e) => {
                e.preventDefault();
                try { svg.setPointerCapture(e.pointerId); } catch (_) {}
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                const isTouch = e.pointerType === 'touch';
                const touchCount = window._loopTouchCount || 0;
                const alreadyMultipleFingers = isTouch && (activePointers.size > 1 || touchCount >= 2 || !e.isPrimary);

                if (activePointers.size === 1) {
                    if (e.button === 1) {
                        isMiddlePanning = true;
                        lastMouseX = e.clientX;
                        lastMouseY = e.clientY;
                        return;
                    }

                    if (alreadyMultipleFingers) {
                        firstTouchDispatched = false;
                        return;
                    }

                    let coords = getSvgCoords(e);
                    if (!coords) return;

                    if (isTouch) {
                        firstTouchTime = performance.now();
                        firstTouchStartX = e.clientX;
                        firstTouchStartY = e.clientY;
                        firstTouchPointerId = e.pointerId;
                        firstTouchDispatched = true;
                        firstTouchMovedDist = 0;
                    }

                    if (svg._dotNetRef) {
                        svg._dotNetRef.invokeMethodAsync('OnSvgPointerDown', coords.x, coords.y, e.button, e.shiftKey, e.ctrlKey || e.metaKey, e.altKey);
                    }
                } else if (activePointers.size === 2) {
                    const elapsed = performance.now() - firstTouchTime;
                    const isStationary = firstTouchMovedDist <= 20;
                    const shouldRevert = firstTouchDispatched && (elapsed <= 300 || (elapsed <= 600 && isStationary));

                    pendingMoveCoords = null;
                    if (moveRafId !== null) {
                        cancelAnimationFrame(moveRafId);
                        moveRafId = null;
                    }

                    if (svg._dotNetRef) {
                        if (shouldRevert) {
                            svg._dotNetRef.invokeMethodAsync('OnRevertFirstTouch');
                        } else {
                            svg._dotNetRef.invokeMethodAsync('OnSvgPointerUp');
                        }
                    }

                    firstTouchDispatched = false;
                    resetPinchBaseline();
                }
            };

            svg.onpointermove = (e) => {
                if (!activePointers.has(e.pointerId)) return;
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    if (isMiddlePanning) {
                        let dx = e.clientX - lastMouseX;
                        let dy = e.clientY - lastMouseY;
                        lastMouseX = e.clientX;
                        lastMouseY = e.clientY;
                        let ctm = svg.getScreenCTM();
                        let svgDx = ctm ? (dx / ctm.a) : dx;
                        let svgDy = ctm ? (dy / ctm.d) : dy;
                        if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnPan', svgDx, svgDy);
                        return;
                    }

                    if (e.pointerId === firstTouchPointerId) {
                        const dist = Math.hypot(e.clientX - firstTouchStartX, e.clientY - firstTouchStartY);
                        if (dist > firstTouchMovedDist) {
                            firstTouchMovedDist = dist;
                        }
                    }

                    if (e.buttons === 0) return;
                    let coords = getSvgCoords(e);
                    if (!coords) return;
                    pendingMoveCoords = coords;
                    if (moveRafId === null) {
                        moveRafId = requestAnimationFrame(flushPendingMove);
                    }
                } else if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    const currentMidX = (pts[0].x + pts[1].x) / 2;
                    const currentMidY = (pts[0].y + pts[1].y) / 2;

                    const scale = pinchStartDist > 0 ? (currentDist / pinchStartDist) : 1;
                    const dx = currentMidX - pinchStartMidX;
                    const dy = currentMidY - pinchStartMidY;
                    let ctm = svg.getScreenCTM();
                    let svgDx = ctm ? (dx / ctm.a) : dx;
                    let svgDy = ctm ? (dy / ctm.d) : dy;

                    if (svg._dotNetRef) {
                        svg._dotNetRef.invokeMethodAsync('OnTwoFingerPanZoom', svgDx, svgDy, scale);
                    }

                    pinchStartDist = currentDist;
                    pinchStartMidX = currentMidX;
                    pinchStartMidY = currentMidY;
                }
            };

            const onPointerEnd = (e) => {
                const tracked = activePointers.has(e.pointerId);
                if (!tracked && !isMiddlePanning) return;

                try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
                if (tracked) {
                    activePointers.delete(e.pointerId);
                }

                if (e.type === 'pointercancel' && e.pointerId === firstTouchPointerId && firstTouchDispatched) {
                    const elapsed = performance.now() - firstTouchTime;
                    if (elapsed <= 600 && firstTouchMovedDist <= 20) {
                        if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnRevertFirstTouch');
                    }
                }

                if (e.pointerId === firstTouchPointerId) {
                    firstTouchDispatched = false;
                    firstTouchPointerId = null;
                }
                if (e.button === 1) {
                    isMiddlePanning = false;
                }
                if (activePointers.size === 0) {
                    isMiddlePanning = false;
                    pendingMoveCoords = null;
                    if (moveRafId !== null) {
                        cancelAnimationFrame(moveRafId);
                        moveRafId = null;
                    }
                    if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnSvgPointerUp');
                } else {
                    resetPinchBaseline();
                }
            };

            svg.onpointerup = onPointerEnd;
            svg.onpointercancel = onPointerEnd;
            if (window._loopWindowPointerUpHandler) {
                window.removeEventListener('pointerup', window._loopWindowPointerUpHandler);
            }
            window._loopWindowPointerUpHandler = onPointerEnd;
            window.addEventListener('pointerup', onPointerEnd);

            svg.onwheel = (e) => {
                e.preventDefault();
                if (window._loopWheelMode === 'undoredo' && !e.ctrlKey && !e.metaKey) {
                    if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnWheelUndoRedo', e.deltaY);
                    return;
                }
                let factor = e.deltaY < 0 ? 1.15 : 0.87;
                if (svg._dotNetRef) svg._dotNetRef.invokeMethodAsync('OnWheelZoom', factor);
            };

            svg.oncontextmenu = (e) => {
                e.preventDefault();
            };
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const notifyUpdate = (worker) => {
                    window._loopPwaUpdateReady = true;
                    window._loopWaitingWorker = worker;
                    if (window._dotNetHomeRef) {
                        window._dotNetHomeRef.invokeMethodAsync('OnPwaUpdateAvailable');
                    }
                };

                navigator.serviceWorker.register('service-worker.js').then(reg => {
                    if (reg.waiting && navigator.serviceWorker.controller) {
                        notifyUpdate(reg.waiting);
                    }
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                notifyUpdate(newWorker);
                            }
                        });
                    });
                }).catch(err => console.log('SW registration error:', err));
            });
        }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
